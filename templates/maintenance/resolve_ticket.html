{% extends "base.html" %}{% block title %}Submit Work Report{% endblock %}{% block content %}<section class="page-shell py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="surface-card p-4 p-lg-5"><span class="eyebrow">JOB COMPLETION</span><h1 class="page-heading mt-2">Submit work report</h1><p class="text-secondary">{{ ticket.title }} · {{ ticket.property.title }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<label class="form-label fw-semibold">What work did you complete?</label><textarea name="technician_note" class="form-control mb-3" rows="4" minlength="10" required></textarea><label class="form-label fw-semibold">Materials or spare parts used</label><textarea name="materials_used" class="form-control mb-3" rows="2"></textarea><div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Work cost (₹)</label><input type="number" min="0" step="0.01" name="work_cost" class="form-control" value="0"></div><div class="col-md-6"><label class="form-label fw-semibold">Time spent (minutes)</label><input type="number" min="0" name="work_minutes" class="form-control" value="0"></div></div><label class="form-label fw-semibold mt-3">After-work photograph</label><input type="file" name="resolution_photo" class="form-control mb-3" accept="image/*"><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="requires_revisit" id="requires_revisit"><label class="form-check-label" for="requires_revisit">A follow-up visit is required</label></div><button class="btn btn-success btn-lg">Submit completion report</button> <a class="btn btn-outline-secondary btn-lg" href="{% url 'maintenance:technician_tickets' %}">Cancel</a></form></div></div></div></section>{% endblock %}
